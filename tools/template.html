<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База знаний НТ — Linux, сеть, БД, рантаймы, архитектура</title>
<meta name="description" content="База знаний по нагрузочному тестированию и производительности: Linux, сеть, PostgreSQL, ClickHouse, Kafka, Redis, JVM, Go, Python, Kubernetes, system design">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* ============================================================
   База знаний НТ — «тёплая редакционная» тема.
   Палитра: уголь и глина в тёмной, бумага и терракота в светлой.
   Шрифты только системные — страница обязана работать офлайн.
   ============================================================ */
:root{
  /* тёмная тема — тёплый уголь, без синевы */
  --bg:#15120F; --bg2:#1B1713; --card:#201B16; --card-h:#282018; --line:#332B23; --line2:#473A2E;
  --tx:#F2ECE4; --tx2:#DDD4C8; --tx3:#B5A999; --mut:#8F8273; --mut2:#6E6358;
  --code-bg:#110E0B; --code-tx:#D2C6B5; --inl-bg:#2C241B; --inl-tx:#EAB183;
  --acc:#D9713F; --acc-s:#E89262; --ok:#7BA86C; --mark:#D9713F45;
  --shadow:0 1px 2px #0005, 0 8px 24px #0004;
  --shadow-s:0 1px 2px #0004;

  --f-ui:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --f-head:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono","SF Mono",Menlo,Consolas,"Courier New",monospace;
  --read:860px;
}
:root[data-theme="light"]{
  /* светлая тема — тёплая бумага */
  --bg:#FAF7F1; --bg2:#FFFDF9; --card:#FFFFFF; --card-h:#F6F0E6; --line:#E7DFD2; --line2:#D5C8B6;
  --tx:#1E1913; --tx2:#342C23; --tx3:#55483B; --mut:#827261; --mut2:#A89684;
  --code-bg:#F4EEE4; --code-tx:#2A2118; --inl-bg:#F1E8DA; --inl-tx:#8C4418;
  --acc:#B4532A; --acc-s:#8E3F1C; --ok:#4E7A46; --mark:#F7DCA0;
  --shadow:0 1px 2px #8a734a14, 0 8px 24px #8a734a1a;
  --shadow-s:0 1px 2px #8a734a1f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit}
a{color:inherit}
::selection{background:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* ---------- шапка ---------- */
.hdr{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg2) 88%,transparent);
  backdrop-filter:saturate(1.3) blur(10px);-webkit-backdrop-filter:saturate(1.3) blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;height:64px}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--tx2);border-radius:9px;width:38px;height:38px;font-size:16px;cursor:pointer}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--acc),#8C4418);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:var(--shadow-s)}
.brand{min-width:0}
.brand b{display:block;font-family:var(--f-head);font-size:17px;font-weight:600;letter-spacing:.005em;color:var(--tx);white-space:nowrap}
.brand span{display:block;font-size:11.5px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;
  padding:9px 12px 9px 36px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--mut2)}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.search::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-54%);color:var(--mut);font-size:18px}
.tbtn{background:var(--card);border:1px solid var(--line);color:var(--tx2);border-radius:10px;height:38px;padding:0 12px;cursor:pointer;font-size:15px;flex-shrink:0}
.tbtn:hover{border-color:var(--line2)}

/* ---------- каркас ---------- */
.layout{display:flex;align-items:flex-start}
.side{width:282px;flex-shrink:0;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;
  border-right:1px solid var(--line);background:var(--bg2);padding:18px 12px 40px;scrollbar-width:thin}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);margin:22px 12px 8px}
.grp:first-child{margin-top:2px}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:var(--tx3);
  padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14.5px;transition:background .12s,color .12s}
.nav:hover{background:var(--card-h);color:var(--tx)}
.nav.act{color:var(--tx);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.nav .ic{width:22px;text-align:center;flex-shrink:0;font-size:15px}
.nav .pr{margin-left:auto;font-size:11px;color:var(--mut2);font-variant-numeric:tabular-nums}
.main{flex:1;min-width:0;padding:34px 40px 110px}
.wrap{max-width:var(--read);margin:0 auto}
.backdrop{display:none}

/* ---------- шапка страницы ---------- */
.phead{display:flex;gap:16px;align-items:center;margin-bottom:4px}
.pico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.ptitle{font-family:var(--f-head);font-size:31px;font-weight:600;line-height:1.15;letter-spacing:-.012em;color:var(--tx)}
.psub{font-size:12.5px;color:var(--mut);margin-top:5px;letter-spacing:.01em}
.intro{margin:18px 0 4px;font-size:15px;color:var(--tx3);line-height:1.7;
  border-left:2px solid var(--line2);padding-left:16px}
.intro blockquote{border:none;padding:0;margin:0;background:none}
.intro p{margin:5px 0}
.modes{display:flex;gap:7px;margin:24px 0 16px;flex-wrap:wrap}
.mode{padding:7px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--mut);
  cursor:pointer;font-size:13px;font-weight:600;transition:border-color .12s,color .12s}
.mode:hover{border-color:var(--line2);color:var(--tx2)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:12.5px;color:var(--mut)}
.lnk{background:none;border:none;color:var(--mut);cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.lnk:hover{color:var(--tx)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;width:150px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}

/* ---------- карточки разделов ---------- */
.part{margin:38px 0 14px;font-family:var(--f-head);font-size:13px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:8px}
.card{scroll-margin-top:84px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card);
  overflow:hidden;box-shadow:var(--shadow-s);transition:border-color .15s,box-shadow .15s}
.card:hover{box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;width:100%;padding:15px 18px;background:none;border:none;cursor:pointer;text-align:left;color:var(--tx2)}
.card-h:hover{background:var(--card-h)}
.num{font-size:11.5px;color:var(--mut2);min-width:24px;font-variant-numeric:tabular-nums}
.ct{flex:1;font-weight:620;font-size:16px;color:var(--tx);letter-spacing:-.005em}
.arr{color:var(--mut2);font-size:12px}
.chk{width:23px;height:23px;border-radius:7px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:transparent;flex-shrink:0;cursor:pointer;background:none;transition:background .12s,border-color .12s}
.chk:hover{border-color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.card-b{padding:6px 24px 24px;border-top:1px solid var(--line)}

/* ---------- типографика текста ---------- */
.md{color:var(--tx2);font-size:16px;line-height:1.78}
.md p{margin:13px 0}
.md h3{font-family:var(--f-head);font-size:20px;font-weight:600;margin:30px 0 10px;color:var(--tx);letter-spacing:-.008em}
.md h4{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:24px 0 8px;color:var(--mut)}
.md ul,.md ol{margin:11px 0 13px 24px}
.md li{margin:5px 0;padding-left:3px}
.md li::marker{color:var(--mut2)}
.md strong{color:var(--tx);font-weight:650}
.md hr{border:none;border-top:1px solid var(--line);margin:26px 0}
.md blockquote{border-left:3px solid var(--acc);background:var(--card-h);margin:16px 0;padding:12px 18px;
  border-radius:0 10px 10px 0;color:var(--tx3);font-size:15px}
.md code{font-family:var(--f-mono);font-size:13.5px;background:var(--inl-bg);color:var(--inl-tx);padding:2px 6px;border-radius:5px}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:16px 0;overflow-x:auto;line-height:1.62}
.md pre code{background:none;color:var(--code-tx);padding:0;font-size:13.2px;white-space:pre}
.tw{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-s)}
.md table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}
.md th{background:var(--card-h);color:var(--tx);text-align:left;font-weight:650;font-size:12.5px;letter-spacing:.04em;
  text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
.md td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.md tr:first-child td{border-top:none}
.md tbody tr:hover{background:var(--card-h)}
.md a[target]{color:var(--acc);text-underline-offset:3px;text-decoration-thickness:1px}
.wl{color:var(--acc);text-decoration:none;border-bottom:1px dashed currentColor}
.wl:hover{border-bottom-style:solid}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
pre.kpre{white-space:pre-wrap;font-family:var(--f-mono);font-size:13.4px;line-height:1.75;color:var(--code-tx);
  background:none;border:none;border-left:2px solid var(--line2);padding:3px 0 3px 18px;margin:14px 0 0;overflow-x:auto}

/* ---------- вопросы ---------- */
.qg{font-family:var(--f-head);font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;
  letter-spacing:.14em;margin:30px 0 12px;border-bottom:1px solid var(--line);padding-bottom:7px}
.q{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;
  margin-bottom:8px;background:var(--card);font-size:15.5px;color:var(--tx2);line-height:1.6;box-shadow:var(--shadow-s)}
.q .qn{font-size:11.5px;color:var(--mut2);min-width:24px;padding-top:4px;font-variant-numeric:tabular-nums}
.q .qt{flex:1}
.q.known .qt{color:var(--mut)}
.ans{margin:14px 0 0;background:var(--code-bg);border-radius:10px;padding:16px 18px}
.ans-l{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
.ans pre{white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.78;color:var(--tx3)}
.rand{border:1px solid var(--acc);border-radius:14px;padding:20px 22px;margin-bottom:20px;background:var(--card);box-shadow:var(--shadow)}
.rand .rq{font-family:var(--f-head);font-size:20px;font-weight:600;color:var(--tx);margin:8px 0 14px;line-height:1.35}

/* ---------- ядро Linux: чипы, термины ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 8px}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--mut);
  cursor:pointer;font-size:13px;white-space:nowrap;transition:border-color .12s,color .12s}
.chip:hover{border-color:var(--line2);color:var(--tx2)}
.term{display:flex;gap:18px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.term-t{font-family:var(--f-mono);font-weight:600;font-size:13.5px;color:var(--inl-tx);min-width:190px;flex-shrink:0;padding-top:1px}
.term-d{font-size:15px;color:var(--tx3);line-height:1.65}
.tip{margin:22px 0;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0 12px 12px 0;
  font-size:13.5px;color:var(--mut);background:var(--card)}
.tip b{color:var(--acc)}

/* ---------- поиск ---------- */
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:14px 18px;margin-bottom:8px;cursor:pointer;color:var(--tx2);transition:border-color .12s,box-shadow .12s}
.res:hover{border-color:var(--acc);box-shadow:var(--shadow)}
.res .rp{font-size:11px;color:var(--mut);margin-bottom:3px;letter-spacing:.05em;text-transform:uppercase}
.res .rt{font-weight:620;font-size:15.5px;color:var(--tx)}
.res .rs{font-size:13.5px;color:var(--tx3);margin-top:6px;line-height:1.6}
.empty{color:var(--mut);padding:50px 0;text-align:center;font-size:15px}

/* ---------- плитки карты ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:20px 0 26px}
.tile{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--card);cursor:pointer;text-align:left;
  color:var(--tx2);box-shadow:var(--shadow-s);transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{border-color:var(--acc);box-shadow:var(--shadow);transform:translateY(-1px)}
.tile .ti{font-size:25px}
.tile .tt{font-family:var(--f-head);font-weight:600;font-size:17px;margin:9px 0 3px;color:var(--tx)}
.tile .ts{font-size:13px;color:var(--mut);line-height:1.5}

/* ---------- адаптив ---------- */
@media (max-width:900px){
  .menu-btn{display:block}
  .side{position:fixed;left:0;top:64px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 10px 50px #0009}
  body.drawer .side{transform:none}
  body.drawer .backdrop{display:block;position:fixed;inset:64px 0 0 0;background:#0008;z-index:35}
  .main{padding:22px 18px 90px}
  .brand span{display:none}
  .search{max-width:none}
  .term{flex-direction:column;gap:5px}.term-t{min-width:0}
  .card-b{padding:6px 16px 20px}
  .ptitle{font-size:26px}
}
@media (max-width:520px){
  .brand{display:none}
  .hdr{gap:10px;padding:0 14px}
  .ptitle{font-size:22px}
  .pico{width:44px;height:44px;font-size:22px}
  .md,.q,.ans pre{font-size:15px}
  .tiles{grid-template-columns:1fr}
}
@media print{
  .hdr,.side,.modes,.tools,.chk,.backdrop{display:none}
  .main{padding:0}.card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<header class="hdr">
  <button class="menu-btn" id="menuBtn" aria-label="Меню">☰</button>
  <div class="logo">🐧</div>
  <div class="brand"><b>База знаний НТ</b><span>Linux · сеть · БД · рантаймы · архитектура · методология</span></div>
  <div class="search"><input id="q" type="search" placeholder="Поиск по всей базе…" autocomplete="off"></div>
  <button class="tbtn" id="themeBtn" title="Светлая / тёмная тема">🌗</button>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <div class="backdrop" id="backdrop"></div>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<script type="application/json" id="pagesData">__PAGES_JSON__</script>
<script>
/*__KERNEL__*/
var PAGES = JSON.parse(document.getElementById("pagesData").textContent);
var BYID = {}; PAGES.forEach(function(p){ BYID[p.id] = p; });

var st = { page: "map", mode: "theory", open: {}, kcat: 0, query: "", allOpen: false };

/* storage (per-viewer progress), always guarded */
var store = {
  get: function(k, d){ try { var v = localStorage.getItem("ntkb:" + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem("ntkb:" + k, JSON.stringify(v)); } catch(e){} }
};
var readMap = store.get("read", {});
var knownMap = store.get("known", {});

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function stripTags(s){ return String(s).replace(/<[^>]+>/g, ""); }

/* theme */
(function(){
  var t = store.get("theme", null);
  if (!t) t = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
})();
document.getElementById("themeBtn").onclick = function(){
  var t = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t); store.set("theme", t);
};
document.getElementById("menuBtn").onclick = function(){ document.body.classList.toggle("drawer"); };
document.getElementById("backdrop").onclick = function(){ document.body.classList.remove("drawer"); };

function pageProgress(p){
  if (p.id === "map" || p.id === "lit") return [0, 0];
  if (p.kind === "md"){
    var n = p.sections.filter(function(s){ return !s.part; }).length, r = 0;
    p.sections.forEach(function(s, i){ if (!s.part && readMap[p.id + "/" + i]) r++; });
    return [r, n];
  }
  if (p.kind === "kernel"){
    var tot = 0, rd = 0;
    KERNEL.forEach(function(c, ci){ c.theory.forEach(function(t, ti){ tot++; if (readMap["kernel/" + ci + "/" + ti]) rd++; }); });
    return [rd, tot];
  }
  return [0, 0];
}

function renderSide(){
  var h = "", g = null;
  PAGES.forEach(function(p){
    if (p.group !== g){ g = p.group; h += '<div class="grp">' + esc(g) + '</div>'; }
    var pr = pageProgress(p), act = st.page === p.id && !st.query;
    h += '<button class="nav' + (act ? " act" : "") + '" data-page="' + p.id + '" style="' + (act ? "background:" + p.color + "22" : "") + '">' +
         '<span class="ic">' + p.icon + '</span><span>' + esc(p.short) + '</span>' +
         (pr[1] ? '<span class="pr">' + pr[0] + '/' + pr[1] + '</span>' : '') + '</button>';
  });
  var side = document.getElementById("side"); side.innerHTML = h;
  side.querySelectorAll("[data-page]").forEach(function(b){
    b.onclick = function(){ document.body.classList.remove("drawer"); go(this.getAttribute("data-page")); };
  });
}

function go(pid, sec){
  st.query = ""; document.getElementById("q").value = "";
  if (st.page !== pid){ st.mode = "theory"; st.open = {}; st.kcat = 0; st.allOpen = (pid === "lit"); }
  st.page = pid;
  var hash = "#" + pid + (sec !== undefined ? "/" + sec : "");
  if (location.hash !== hash) history.replaceState(null, "", hash);
  if (sec !== undefined){
    if (pid === "kernel"){ var parts = String(sec).split("."); st.kcat = +parts[0]; st.mode = parts[1] === "q" ? "qa" : "theory"; st.open = {}; st.open[(parts[1] === "q" ? "q" : "t") + parts[2]] = true; }
    else { st.mode = "theory"; st.open[sec] = true; }
  }
  render();
  if (sec !== undefined){
    setTimeout(function(){ var el = document.getElementById("s-" + String(sec).replace(/\./g,"-")); if (el) el.scrollIntoView({block:"start"}); }, 30);
  } else window.scrollTo(0, 0);
}

function headHtml(p, sub){
  return '<div class="phead"><div class="pico" style="background:' + p.color + '22">' + p.icon + '</div><div><div class="ptitle">' +
         esc(p.title || p.short) + '</div><div class="psub">' + sub + '</div></div></div>';
}
function modesHtml(p, list){
  var h = '<div class="modes">';
  list.forEach(function(m){
    var a = st.mode === m[0];
    h += '<button class="mode" data-mode="' + m[0] + '" style="' + (a ? "background:" + p.color + ";border-color:" + p.color + ";color:#fff" : "") + '">' + m[1] + '</button>';
  });
  return h + '</div>';
}
function bar(p, r, n){
  var pct = n ? Math.round(100 * r / n) : 0;
  return '<span>Прочитано ' + r + ' из ' + n + '</span><span class="bar"><i style="width:' + pct + '%;background:' + p.color + '"></i></span>';
}

function renderMd(p){
  var pr = pageProgress(p), qn = 0;
  p.questions.forEach(function(g){ qn += g.items.length; });
  var h = headHtml(p, p.sections.filter(function(s){return !s.part;}).length + " разделов · " + qn + " вопросов");
  if (p.intro) h += '<div class="intro md">' + p.intro + '</div>';
  if (p.id === "map") h += mapTiles();
  var modes = [["theory", "📖 Теория"]];
  if (qn) modes.push(["qa", "💬 Вопросы (" + qn + ")"]);
  h += modesHtml(p, modes);
  if (st.mode === "theory"){
    h += '<div class="tools">' + (pr[1] ? bar(p, pr[0], pr[1]) : '') +
         '<button class="lnk" id="toggleAll">' + (st.allOpen ? "Свернуть все" : "Развернуть все") + '</button></div>';
    var n = 0;
    p.sections.forEach(function(s, i){
      if (s.part){ h += '<div class="part">' + esc(s.t) + '</div>' + (s.h ? '<div class="md">' + s.h + '</div>' : ''); return; }
      n++;
      var o = st.allOpen || !!st.open[i], rd = !!readMap[p.id + "/" + i];
      var title = s.t.replace(/^\d+(\.\d+)*\.?\s+/, "");
      h += '<div class="card" id="s-' + i + '" style="' + (o ? "border-color:" + p.color + "66" : "") + '">' +
           '<div class="card-h" data-open="' + i + '"><span class="num">' + n + '</span><span class="ct">' + esc(title) + '</span>' +
           '<button class="chk' + (rd ? " on" : "") + '" data-read="' + i + '" title="Отметить прочитанным">✓</button>' +
           '<span class="arr">' + (o ? "▲" : "▼") + '</span></div>' +
           (o ? '<div class="card-b md">' + hl(s.h) + '</div>' : '') + '</div>';
    });
  } else {
    h += questionsHtml(p);
  }
  return h;
}

function mapTiles(){
  var h = '<div class="tiles">';
  PAGES.forEach(function(p){
    if (p.id === "map") return;
    var pr = pageProgress(p);
    h += '<button class="tile" data-go="' + p.id + '"><div class="ti">' + p.icon + '</div><div class="tt">' + esc(p.short) +
         '</div><div class="ts">' + esc(p.group) + (pr[1] ? ' · прочитано ' + pr[0] + '/' + pr[1] : '') + '</div></button>';
  });
  return h + '</div>';
}

function questionsHtml(p){
  var all = [], h = "";
  p.questions.forEach(function(g, gi){ g.items.forEach(function(q, qi){ all.push([gi, qi, q]); }); });
  var kn = all.filter(function(a){ return knownMap[p.id + "/" + a[0] + "/" + a[1]]; }).length;
  h += '<div class="tools">' + '<span>Знаю ' + kn + ' из ' + all.length + '</span><span class="bar"><i style="width:' +
       (all.length ? Math.round(100 * kn / all.length) : 0) + '%;background:' + p.color + '"></i></span>' +
       '<button class="lnk" id="randQ">🎲 Случайный незакрытый вопрос</button></div>';
  if (st.rand && st.rand.page === p.id){
    h += '<div class="rand"><div class="ans-l" style="color:' + p.color + '">Ответь вслух за 2 минуты</div><div class="rq">' + st.rand.q +
         '</div><button class="lnk" id="randNext">Следующий</button> · <button class="lnk" id="randKnow">Знаю — отметить</button></div>';
  }
  p.questions.forEach(function(g, gi){
    h += '<div class="qg">' + esc(g.g) + '</div>';
    g.items.forEach(function(q, qi){
      var k = p.id + "/" + gi + "/" + qi, on = !!knownMap[k];
      h += '<div class="q' + (on ? " known" : "") + '"><span class="qn">' + (qi + 1) + '</span><span class="qt">' + q +
           '</span><button class="chk' + (on ? " on" : "") + '" data-known="' + k + '" title="Знаю">✓</button></div>';
    });
  });
  h += '<div class="tip"><b>Как отвечать: </b>называй инструмент + конкретную команду или метрику + что именно ищешь в выводе. Ответы — в разделах теории этой страницы.</div>';
  return h;
}

function renderKernel(p){
  var c = KERNEL[st.kcat];
  var h = headHtml(p, KERNEL.length + " подсистем · теория, вопросы с эталонными ответами, глоссарий");
  h += '<div class="chips">';
  KERNEL.forEach(function(k, j){
    var a = st.kcat === j;
    h += '<button class="chip" data-kcat="' + j + '" style="' + (a ? "border-color:" + k.color + ";background:" + k.color + "22;color:" + k.color : "") + '">' + k.icon + " " + esc(k.title) + '</button>';
  });
  h += '</div>';
  h += modesHtml({color: c.color}, [["theory","📖 Теория"],["qa","💬 Вопросы"],["terms","📚 Глоссарий"]]);
  if (st.mode === "theory"){
    c.theory.forEach(function(t, k){
      var o = !!st.open["t" + k], rk = "kernel/" + st.kcat + "/" + k, rd = !!readMap[rk];
      h += '<div class="card" id="s-' + st.kcat + '-t-' + k + '" style="' + (o ? "border-color:" + c.color + "66" : "") + '">' +
           '<div class="card-h" data-open="t' + k + '"><span class="num">' + (k + 1) + '</span><span class="ct">' + esc(t.title) + '</span>' +
           '<button class="chk' + (rd ? " on" : "") + '" data-read="' + rk + '">✓</button><span class="arr">' + (o ? "▲" : "▼") + '</span></div>' +
           (o ? '<div class="card-b"><pre class="kpre" style="border-left-color:' + c.color + '55">' + hl(esc(t.body)) + '</pre></div>' : '') + '</div>';
    });
    h += '<div class="tip"><b>Как учить: </b>прочитай раздел, открой «Вопросы», ответь вслух своими словами 2 минуты и сверься с эталоном.</div>';
  } else if (st.mode === "qa"){
    c.qa.forEach(function(q, m){
      var o = !!st.open["q" + m];
      h += '<div class="card" id="s-' + st.kcat + '-q-' + m + '" style="' + (o ? "border-color:" + c.color + "66" : "") + '">' +
           '<div class="card-h" data-open="q' + m + '"><span class="num">' + (m + 1) + '</span><span class="ct">' + esc(q.q) + '</span><span class="arr">' + (o ? "▲" : "▼") + '</span></div>' +
           (o ? '<div class="card-b"><div class="ans" style="border:1px solid ' + c.color + '33"><div class="ans-l" style="color:' + c.color + '">Эталонный ответ</div><pre>' + esc(q.a) + '</pre></div></div>' : '') + '</div>';
    });
  } else {
    c.terms.forEach(function(t){
      h += '<div class="term"><div class="term-t" style="color:' + c.color + '">' + esc(t.t) + '</div><div class="term-d">' + esc(t.d) + '</div></div>';
    });
  }
  return h;
}

/* highlight current query inside opened content (text nodes only, rough) */
var HL = "";
function hl(html){
  if (!HL || HL.length < 2) return html;
  var re = new RegExp("(" + HL.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return html.split(/(<[^>]+>)/).map(function(part){ return part.charAt(0) === "<" ? part : part.replace(re, "<mark>$1</mark>"); }).join("");
}

function searchResults(q){
  var ql = q.toLowerCase(), out = [];
  function snip(text){
    var i = text.toLowerCase().indexOf(ql); if (i < 0) return "";
    var a = Math.max(0, i - 70), b = Math.min(text.length, i + ql.length + 110);
    return (a ? "…" : "") + esc(text.slice(a, i)) + "<mark>" + esc(text.slice(i, i + ql.length)) + "</mark>" + esc(text.slice(i + ql.length, b)) + (b < text.length ? "…" : "");
  }
  PAGES.forEach(function(p){
    if (p.kind !== "md") return;
    p.sections.forEach(function(s, i){
      if (s.part) return;
      if (s.x.toLowerCase().indexOf(ql) >= 0) out.push({p: p, sec: i, t: s.t, s: snip(s.x), score: s.t.toLowerCase().indexOf(ql) >= 0 ? 0 : 1});
    });
  });
  var kp = BYID.kernel;
  KERNEL.forEach(function(c, ci){
    c.theory.forEach(function(t, ti){
      var txt = t.title + " " + t.body;
      if (txt.toLowerCase().indexOf(ql) >= 0) out.push({p: kp, sec: ci + ".t." + ti, t: c.title + " → " + t.title, s: snip(txt), score: t.title.toLowerCase().indexOf(ql) >= 0 ? 0 : 1});
    });
    c.qa.forEach(function(x, qi){
      var txt = x.q + " " + x.a;
      if (txt.toLowerCase().indexOf(ql) >= 0) out.push({p: kp, sec: ci + ".q." + qi, t: c.title + " → ❓ " + x.q, s: snip(txt), score: 2});
    });
  });
  out.sort(function(a, b){ return a.score - b.score; });
  return out;
}

function renderSearch(){
  var res = searchResults(st.query), h = '<div class="ptitle" style="margin-bottom:4px">Поиск: «' + esc(st.query) + '»</div><div class="psub" style="margin-bottom:14px">' + res.length + ' совпадений</div>';
  if (!res.length) h += '<div class="empty">Ничего не найдено. Попробуй другое слово или английский термин.</div>';
  res.slice(0, 150).forEach(function(r, i){
    h += '<button class="res" data-res="' + i + '"><div class="rp">' + r.p.icon + ' ' + esc(r.p.short) + '</div><div class="rt">' + esc(r.t) + '</div><div class="rs">' + r.s + '</div></button>';
  });
  st._res = res;
  return h;
}

function render(){
  var v = document.getElementById("view"), h;
  HL = st.query ? "" : (st.hl || "");
  if (st.query && st.query.length >= 2) h = renderSearch();
  else {
    var p = BYID[st.page] || PAGES[0];
    h = p.kind === "kernel" ? renderKernel(p) : renderMd(p);
  }
  v.innerHTML = h;
  renderSide();
  bind(v);
}

function bind(v){
  v.querySelectorAll("[data-mode]").forEach(function(b){ b.onclick = function(){ st.mode = this.getAttribute("data-mode"); st.open = {}; render(); }; });
  v.querySelectorAll("[data-kcat]").forEach(function(b){ b.onclick = function(){ st.kcat = +this.getAttribute("data-kcat"); st.open = {}; render(); }; });
  v.querySelectorAll("[data-open]").forEach(function(b){
    b.onclick = function(e){
      if (e.target.closest("[data-read]")) return;
      var k = this.getAttribute("data-open");
      if (st.allOpen){ st.allOpen = false; var p = BYID[st.page]; if (p.sections) p.sections.forEach(function(s, i){ st.open[i] = true; }); }
      st.open[k] = !st.open[k]; render();
    };
  });
  v.querySelectorAll("[data-read]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var k = this.getAttribute("data-read"), key = /^kernel\//.test(k) ? k : st.page + "/" + k;
      if (readMap[key]) delete readMap[key]; else readMap[key] = 1;
      store.set("read", readMap); render();
    };
  });
  v.querySelectorAll("[data-known]").forEach(function(b){
    b.onclick = function(){ var k = this.getAttribute("data-known"); if (knownMap[k]) delete knownMap[k]; else knownMap[k] = 1; store.set("known", knownMap); render(); };
  });
  v.querySelectorAll("[data-go]").forEach(function(b){ b.onclick = function(){ go(this.getAttribute("data-go")); }; });
  v.querySelectorAll("[data-res]").forEach(function(b){
    b.onclick = function(){ var r = st._res[+this.getAttribute("data-res")]; st.hl = st.query; go(r.p.id, r.sec); };
  });
  var ta = document.getElementById("toggleAll");
  if (ta) ta.onclick = function(){ st.allOpen = !st.allOpen; if (!st.allOpen) st.open = {}; render(); };
  var rq = document.getElementById("randQ");
  if (rq) rq.onclick = function(){ pickRandom(); render(); };
  var rn = document.getElementById("randNext");
  if (rn) rn.onclick = function(){ pickRandom(); render(); };
  var rk = document.getElementById("randKnow");
  if (rk) rk.onclick = function(){ knownMap[st.rand.key] = 1; store.set("known", knownMap); pickRandom(); render(); };
  v.querySelectorAll("a.wl").forEach(function(a){
    a.onclick = function(e){ e.preventDefault(); st.hl = ""; go(this.getAttribute("href").slice(1)); };
  });
}

function pickRandom(){
  var p = BYID[st.page], pool = [];
  p.questions.forEach(function(g, gi){ g.items.forEach(function(q, qi){ var k = p.id + "/" + gi + "/" + qi; if (!knownMap[k]) pool.push({q: q, key: k}); }); });
  if (!pool.length){ st.rand = {page: p.id, q: "Все вопросы отмечены как известные 🎉", key: ""}; return; }
  var x = pool[Math.floor(Math.random() * pool.length)];
  st.rand = {page: p.id, q: x.q, key: x.key};
}

var qt;
document.getElementById("q").addEventListener("input", function(){
  var val = this.value.trim();
  clearTimeout(qt);
  qt = setTimeout(function(){ st.query = val; if (!val) st.hl = ""; render(); window.scrollTo(0, 0); }, 160);
});

function fromHash(){
  var h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  var parts = h.split("/"), pid = parts[0];
  if (!BYID[pid]) return;
  st.hl = "";
  go(pid, parts.length > 1 ? (pid === "kernel" ? parts[1] : +parts[1]) : undefined);
}
window.addEventListener("hashchange", fromHash);
if (location.hash) fromHash(); else render();
</script>
